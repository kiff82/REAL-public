name: release-audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q real scripts utils train_real_v1_3.py examples tests
      - run: python scripts/release_audit.py
      - run: python scripts/build_release_manifest.py --check
